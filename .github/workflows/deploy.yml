name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/herzog-doc-2026

            echo "── Pulling latest from main ──"
            git fetch origin
            git reset --hard origin/main

            echo "── Installing client dependencies ──"
            cd client
            npm ci

            echo "── Building frontend → server/public/ ──"
            npm run build

            echo "── Installing server dependencies ──"
            cd ../server
            npm ci

            echo "── Syncing src collections → display collections ──"
            node prodScripts/syncSrc.js

            echo "── Restarting PM2 process ──"
            pm2 restart herzog-doc-2026

            echo "── Deploy complete ──"
