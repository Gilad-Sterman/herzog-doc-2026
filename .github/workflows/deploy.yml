name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ec2-user@${EC2_HOST} bash << 'ENDSSH'
            set -e
            cd /home/ec2-user/herzog-doc-2026

            echo "── Pulling latest from main ──"
            git fetch origin
            git reset --hard origin/main

            echo "── Installing client dependencies ──"
            cd client && npm ci

            echo "── Building frontend → server/public/ ──"
            npm run build

            echo "── Installing server dependencies ──"
            cd ../server && npm ci

            echo "── Syncing src collections → display collections ──"
            node prodScripts/syncSrc.js

            echo "── Restarting PM2 process ──"
            pm2 restart herzog-doc-2026

            echo "── Deploy complete ──"
          ENDSSH
